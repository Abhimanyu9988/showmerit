name: dns
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Write the changes. Leave off for a dry run.
        type: boolean
        default: false
permissions: { contents: read }
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/dns_setup.py ${{ inputs.apply && '--apply' || '' }}
        env:
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
