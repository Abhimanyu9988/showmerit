name: run-box
on:
  pull_request:
    paths: [".devcontainer/**", "labs/**", ".github/workflows/run-box.yml"]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  codespace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            for i in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 2; done
            cd labs/opentelemetry-java-agent-in-splunk-apm-one-env-var-zero-code && bash check.sh
